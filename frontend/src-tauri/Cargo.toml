[package]
name = "keyboard-assistant-frontend"
version = "0.1.0"
description = "Tauri settings UI for Keyboard Assistant"
edition = "2021"

[lib]
name = "keyboard_assistant_frontend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
